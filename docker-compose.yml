version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: flipai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-flipai_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Store database files persistently on host machine
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flipai-network

  # Django Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flipai-backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      # Override .env values for Docker
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: ${DEBUG:-True}
    ports:
      - "8000:8000"
    volumes:
      # Mount entire project for live reload during development
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flipai-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local

networks:
  flipai-network:
    driver: bridge
